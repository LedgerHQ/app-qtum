name: Unit

on:
  workflow_dispatch:
  push:
    branches:
      - babylon
      - unit-test
  pull_request:

permissions:
  contents: read
  actions: write
  code-quality: write
  pull-requests: write

jobs:
  job_unit_test:
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_unit_tests.yml@v1
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
