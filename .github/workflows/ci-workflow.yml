name: CI

on:
  workflow_dispatch:
  push:
    branches:
    - master
    - develop
  pull_request:
    branches:
    - master
    - develop

jobs:
  job_build:
    name: Compilation for NanoS, X, S+, and Stax

    strategy:
      matrix:
        include:
          - model: nanos
            SDK: "$NANOS_SDK"
          - model: nanox
            SDK: "$NANOX_SDK"
          - model: nanosp
            SDK: "$NANOSP_SDK"
          - model: stax
            SDK: "$STAX_SDK"

    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-builder:latest

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Build
        run: |
          make DEBUG=0 COIN=qtum BOLOS_SDK=${{ matrix.SDK }} && mv bin/ qtum-bin/
          make clean
          make DEBUG=0 COIN=qtum_testnet BOLOS_SDK=${{ matrix.SDK }} && mv bin/ qtum-testnet-bin/
      - name: Upload Qtum app binary
        uses: actions/upload-artifact@v6
        with:
          name: qtum-app-${{ matrix.model }}
          path: qtum-bin

      - name: Upload Qtum Testnet app binary
        uses: actions/upload-artifact@v6
        with:
          name: qtum-testnet-app-${{ matrix.model }}
          path: qtum-testnet-bin

  job_test:
    if: false
    name: Tests
    strategy:
      matrix:
        include:
          - model: nanos
          - model: nanox
          - model: nanosp
          - model: stax

    needs: job_build
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ledgerhq/app-bitcoin/speculos-bitcoin:latest
      ports:
        - 1234:1234
        - 9999:9999
        - 40000:40000
        - 41000:41000
        - 42000:42000
        - 43000:43000
      options: --entrypoint /bin/bash

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Download Qtum Testnet app binary
        uses: actions/download-artifact@v7
        with:
          name: qtum-testnet-app-${{matrix.model}}
          path: bin

      - name: Run tests
        run: |
          cd tests
          pip install -r requirements.txt
          PYTHONPATH=$PYTHONPATH:/speculos pytest --headless --model=${{ matrix.model }} --timeout=300

  job_test_mainnet:
    if: false
    name: Tests on mainnet
    strategy:
      matrix:
        include:
          - model: nanos
          - model: nanox
          - model: nanosp
          - model: stax

    needs: job_build
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ledgerhq/app-bitcoin/speculos-bitcoin:latest
      ports:
        - 1234:1234
        - 9999:9999
        - 40000:40000
        - 41000:41000
        - 42000:42000
        - 43000:43000
      options: --entrypoint /bin/bash

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Download Qtum app binary
        uses: actions/download-artifact@v7
        with:
          name: qtum-app-${{matrix.model}}
          path: bin

      - name: Run tests
        run: |
          cd tests_mainnet
          pip install -r requirements.txt
          PYTHONPATH=$PYTHONPATH:/speculos pytest --headless --model=${{ matrix.model }} --timeout=300

  job_test_python_lib_legacyapp:
    name: Tests with the Python library and legacy Qtum app
    needs: job_build
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ledgerhq/app-bitcoin/speculos-bitcoin:latest
      ports:
        - 1234:1234
        - 9999:9999
        - 40000:40000
        - 41000:41000
        - 42000:42000
        - 43000:43000
      options: --entrypoint /bin/bash

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Run tests
        run: |
          cd bitcoin_client/tests
          pip install -r requirements.txt
          PYTHONPATH=$PYTHONPATH:/speculos pytest --headless --timeout=300

  job_test_js_lib:
    if: false
    name: Tests with the JS library
    needs: job_build
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ledgerhq/app-bitcoin/speculos-bitcoin:latest
      ports:
        - 1234:1234
        - 9999:9999
        - 40000:40000
        - 41000:41000
        - 42000:42000
        - 43000:43000
      options: --entrypoint /bin/bash

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: '16'

      - name: Install yarn
        run: |
          npm install -g yarn

      - name: Download Qtum Testnet app binary
        uses: actions/download-artifact@v7
        with:
          name: qtum-testnet-app-nanos
          path: bin

      - name: Run tests
        run: |
          cd bitcoin_client_js
          yarn install
          LOG_SPECULOS=1 LOG_APDUS=1 SPECULOS="/speculos/speculos.py" yarn test

  job_test_rust_client:
    name: Tests for rust client library
    needs: job_build
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/ledgerhq/ledger-app-builder/ledger-app-builder:latest

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Run tests
        run: |
          cd bitcoin_client_rs/
          cargo test --no-default-features --features="async"
